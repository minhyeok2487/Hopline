<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hopline</title>
</head>
<body class="booting">
<div id="boot"><div class="boot-mark"><i data-icon="logo"></i></div><div class="boot-bar"><i></i></div></div>

<div id="app">
    <aside id="side">
        <div class="side-head">
            <span class="brand"><i data-icon="logo"></i>Hopline</span>
            <button id="side-collapse" class="ghost icon" data-i18n-title="side.collapse"><i data-icon="sidebar"></i></button>
        </div>
        <nav class="side-tabs" role="tablist">
            <button data-panel="sessions" class="on" role="tab" data-i18n="side.sessions"></button>
            <button data-panel="sftp" role="tab" data-i18n="side.sftp"></button>
            <button data-panel="macros" role="tab" data-i18n="side.macros"></button>
        </nav>

        <section id="p-sessions" class="panel">
            <div class="row">
                <label class="field grow"><i data-icon="search"></i><input id="sess-filter" data-i18n-placeholder="sess.search" spellcheck="false"/></label>
                <button id="folder-add" class="icon" data-i18n-title="sess.newFolder"><i data-icon="folderPlus"></i></button>
                <button id="sess-add" class="icon" data-i18n-title="sess.new"><i data-icon="plus"></i></button>
            </div>
            <div id="sess-tree" class="list" tabindex="0"></div>
        </section>

        <section id="p-sftp" class="panel hidden">
            <div id="sftp-host" class="sftp-host"></div>
            <div class="row">
                <button id="sftp-up" class="icon" data-i18n-title="sftp.up"><i data-icon="up"></i></button>
                <div id="sftp-crumbs" class="crumbs grow" data-i18n-title="sftp.crumbs"></div>
                <input id="sftp-path" class="grow hidden" spellcheck="false"/>
                <button id="sftp-refresh" class="icon" data-i18n-title="sftp.refresh"><i data-icon="refresh"></i></button>
            </div>
            <div class="row">
                <button id="sftp-upload" class="grow"><i data-icon="upload"></i><span data-i18n="sftp.upload"></span></button>
                <button id="sftp-mkdir" class="grow"><i data-icon="folderPlus"></i><span data-i18n="sftp.newFolder"></span></button>
            </div>
            <div class="loadbar hidden" id="sftp-loading"><i></i></div>
            <div id="sftp-list" class="list drop"></div>
            <div id="sftp-progress"></div>
        </section>

        <section id="p-macros" class="panel hidden">
            <div class="row">
                <span class="hint grow" data-i18n="macro.hint"></span>
                <button id="macro-add" class="icon" data-i18n-title="macro.new"><i data-icon="plus"></i></button>
            </div>
            <div id="macro-list" class="list"></div>
        </section>
    </aside>
    <div id="resizer" data-i18n-title="resizer"></div>

    <main>
        <div id="topbar">
            <button id="side-open" class="ghost icon hidden" data-i18n-title="side.open"><i data-icon="sidebar"></i></button>
            <label class="field quick"><i data-icon="terminal"></i><input id="quick" data-i18n-placeholder="quick.ph" spellcheck="false"/></label>
            <span class="grow"></span>
            <button id="btn-multi" data-i18n-title="top.multiTip"><i data-icon="multi"></i><span data-i18n="top.multi"></span></button>
            <button id="btn-log" data-i18n-title="top.logTip"><i data-icon="record"></i><span data-i18n="top.log"></span></button>
            <button id="btn-logdir" class="icon" data-i18n-title="top.logdir"><i data-icon="logs"></i></button>
            <button id="btn-mcp" data-i18n-title="top.mcp"><i data-icon="bot"></i><span>MCP</span></button>
            <button id="btn-settings" class="icon" data-i18n-title="top.settings"><i data-icon="gear"></i></button>
        </div>
        <div id="tabbar" role="tablist"></div>
        <div id="terms">
            <div id="empty">
                <div class="empty-inner">
                    <h2 data-i18n="empty.title"></h2>
                    <div id="recents"></div>
                    <dl class="keys">
                        <dt>Ctrl+Tab</dt><dd data-i18n="keys.nextTab"></dd>
                        <dt>Ctrl+Shift+F</dt><dd data-i18n="keys.find"></dd>
                        <dt>Ctrl + = / −</dt><dd data-i18n="keys.zoom"></dd>
                        <dt>Ctrl+Shift+B</dt><dd data-i18n="keys.sidebar"></dd>
                        <dt data-i18n="keys.drag"></dt><dd data-i18n="keys.copyPaste"></dd>
                        <dt>Ctrl+,</dt><dd data-i18n="keys.settings"></dd>
                    </dl>
                </div>
            </div>
        </div>
        <footer id="statusbar">
            <span id="sb-conn" class="sb-item"></span>
            <span id="sb-xfer" class="sb-item grow"></span>
            <span id="sb-multi" class="sb-item"></span>
            <span id="sb-size" class="sb-item mono"></span>
            <span id="sb-mcp" class="sb-item"></span>
        </footer>
    </main>
</div>
<div id="ctx" class="ctx hidden"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
